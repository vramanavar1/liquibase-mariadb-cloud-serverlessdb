driver: org.mariadb.jdbc.Driver
url: jdbc:mariadb://#{DB_HOST}#:#{DB_PORT}#/#{DB_NAME}#?sslMode=trust
changeLogFile: rootChangeLog.xml

# ---------------------------------------------------------------------------
# TOKENS <-> Azure DevOps variable-group mapping (group: liquibase-mariadb)
#   #{DB_HOST}#  = DB_HOST  e.g. <your-server>.db2.skysql.com
#   #{DB_PORT}#  = DB_PORT  e.g. 4048  (SkySQL serverless uses a custom port, NOT 3306)
#   #{DB_NAME}#  = DB_NAME  e.g. VSCTestDatabase
# An inline `sed` step in azure-pipelines.yml replaces these markers with the
# variable-group values at runtime (no marketplace extension needed).
# MariaDB treats schema == database, so there is no defaultSchemaName token.
#
# LOCAL RUN (PowerShell) — replace the tokens with real values, or point at a
# non-tokenized copy, then set the credential env vars below:
#   $env:LIQUIBASE_COMMAND_USERNAME = '<username>'
#   $env:LIQUIBASE_COMMAND_PASSWORD = '<db-password>'
#
# ---------------------------------------------------------------------------
# CONNECTION TROUBLESHOOTING HISTORY (both symptoms produce "Access denied"):
#
# 1) "Access denied for user '<os-user>'@'...' (using password: NO)"
#    -> no credentials supplied; the driver fell back to the OS account with
#       an empty password. Fix: set the LIQUIBASE_COMMAND_* env vars above.
#
# 2) "Access denied for user '<db-user>'@'...' (using password: YES)"
#    -> credentials were correct but TLS was off. SkySQL accounts REQUIRE SSL,
#       and MariaDB Connector/J 3.x defaults to sslMode=disable, so the login
#       is rejected even with the right password. Fix: ?sslMode=trust on the
#       URL above (encrypts, skips cert validation -- fine for this lab).
#       Production-grade alternative -- full certificate validation using the
#       same .pem HeidiSQL uses:
#         ?sslMode=verify-full&serverSslCert=C:\path\to\skysql_chain.pem
#
# NOTE: MariaDB does not allow '.' in database names, hence VSCTestDatabase.
#
# WARNING: do NOT write "password: ${DB_PASSWORD}" here. Liquibase does NOT
# expand ${...} placeholders in this file -- it passes the literal string
# through as the password and the connection fails. Verified against 5.0.3.
# The LIQUIBASE_COMMAND_* env vars are the mechanism that works.
#
# Driver jar: mariadb-java-client-<version>.jar must be on the Liquibase
# classpath. The liquibase/liquibase Docker image does NOT bundle it; the
# pipeline resolves it from Maven via pom.xml and mounts it at
# /liquibase/lib (see azure-pipelines.yml).
# ---------------------------------------------------------------------------
